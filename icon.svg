<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6ccb2"/>
      <stop offset="100%" stop-color="#7f5539"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d78e"/>
      <stop offset="50%" stop-color="#d4a373"/>
      <stop offset="100%" stop-color="#b08968"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#wood)" stroke="#3d2516" stroke-width="24" filter="url(#shadow)"/>
  
  <!-- Inner dark circle -->
  <circle cx="256" cy="256" r="180" fill="#18120e" opacity="0.22"/>
  
  <!-- Crown / Queen symbol -->
  <text x="256" y="320" font-size="220" text-anchor="middle" fill="url(#gold)" font-family="Georgia, serif" font-weight="bold">♛</text>
</svg>
